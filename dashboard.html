<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Cliniware</title>
  <link rel="stylesheet" href="css/cliniware.css">
</head>
<body>

<div class="app-layout">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <h2>Clini<span>ware</span></h2>
      <p>Sistema de Gestión Clínica</p>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-user-avatar" id="sidebar-user-avatar">A</div>
      <div class="sidebar-user-info">
        <div class="sidebar-user-name" id="sidebar-user-name">Cargando...</div>
        <div class="sidebar-user-role" id="sidebar-user-role">—</div>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="sidebar-section-title">Principal</div>
      <a href="dashboard.html" class="sidebar-link" data-page="dashboard"><span class="nav-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg></span> Dashboard</a>
      <div class="sidebar-section-title">Gestión</div>
      <a href="pacientes.html" class="sidebar-link" data-page="pacientes"><span class="nav-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></svg></span> Pacientes</a>
      <a href="medicos.html"   class="sidebar-link" data-page="medicos"><span class="nav-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M5 3v6a4 4 0 0 0 8 0V3M9 13v2a5 5 0 0 0 10 0v-2"/><circle cx="19" cy="9" r="2"/></svg></span> Médicos</a>
      <a href="citas.html"     class="sidebar-link" data-page="citas"><span class="nav-icon"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg></span> Citas</a>
      <a href="pagos.html"     class="sidebar-link" data-page="pagos"><span class="nav-icon"><svg class="icon" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg></span> Pagos</a>
      <a href="servicios.html" class="sidebar-link" data-page="servicios"><span class="nav-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5.5 9.5A1.5 1.5 0 0 0 5.8 21h12.4a1.5 1.5 0 0 0 1.3-2.5L14 9V3"/></svg></span> Servicios</a>
      <div class="sidebar-section-title admin-only">Administración</div>
      <a href="usuarios.html"  class="sidebar-link admin-only" data-page="usuarios"><span class="nav-icon"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg></span> Usuarios</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" id="btn-logout"><span><svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></span> Cerrar Sesión</button>
    </div>
  </aside>

  <!-- ── MAIN CONTENT ── -->
  <div class="main-content">

    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-title">
        <h1>Dashboard</h1>
        <p>Bienvenido, <span id="topbar-user">—</span></p>
      </div>
      <div class="topbar-actions">
        <span class="topbar-date" id="topbar-date">—</span>
        <a href="citas.html" class="btn btn-primary btn-sm">+ Nueva Cita</a>
      </div>
    </header>

    <!-- Page Content -->
    <div class="page-content">

      <!-- Resumen de citas por estado -->
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card">
          <div class="stat-icon amber"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></div>
          <div class="stat-info">
            <div class="stat-value" id="citas-pendientes">—</div>
            <div class="stat-label">Pendientes</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue"><svg class="icon" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
          <div class="stat-info">
            <div class="stat-value" id="citas-confirmadas">—</div>
            <div class="stat-label">Confirmadas</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green"><svg class="icon" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 3.5L16 11H5"/></svg></div>
          <div class="stat-info">
            <div class="stat-value" id="citas-completadas">—</div>
            <div class="stat-label">Completadas</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon red"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg></div>
          <div class="stat-info">
            <div class="stat-value" id="citas-canceladas">—</div>
            <div class="stat-label">Canceladas</div>
          </div>
        </div>
      </div>

      <!-- Próximas citas -->
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">Próximas citas</div>
            <div class="card-subtitle">Agenda de hoy y mañana</div>
          </div>
          <a href="citas.html" class="btn btn-ghost btn-sm">Ver todas</a>
        </div>
        <div class="card-body" id="proximas-citas">
          <!-- Populated by JS -->
        </div>
      </div>

    </div><!-- /page-content -->
  </div><!-- /main-content -->
</div><!-- /app-layout -->

<script src="js/app.js"></script>
<script>
  initSidebar('dashboard');

  function loadDashboard() {
    const citas = MockData.citas;

    // Estado counts
    document.getElementById('citas-pendientes').textContent   = citas.filter(c => c.estado === 'PENDIENTE').length;
    document.getElementById('citas-confirmadas').textContent  = citas.filter(c => c.estado === 'CONFIRMADA').length;
    document.getElementById('citas-completadas').textContent  = citas.filter(c => c.estado === 'COMPLETADA').length;
    document.getElementById('citas-canceladas').textContent   = citas.filter(c => c.estado === 'CANCELADA').length;

    // Próximas citas
    const proximasCitas = document.getElementById('proximas-citas');
    const upcomingCitas = citas.filter(c => c.estado !== 'CANCELADA').slice(0, 5);
    if (upcomingCitas.length === 0) {
      proximasCitas.innerHTML = '<div class="empty-state"><div class="empty-icon"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg></div><h3>Sin citas próximas</h3></div>';
    } else {
      proximasCitas.innerHTML = upcomingCitas.map(c => `
        <div class="appointment-item">
          <span class="appointment-time">${c.hora_cita}</span>
          <div class="appointment-info">
            <div class="appointment-patient">${c.paciente}</div>
            <div class="appointment-doctor">${c.medico} — ${c.servicio}</div>
          </div>
          <span class="${Utils.getEstadoBadge(c.estado)}">${c.estado}</span>
        </div>
      `).join('');
    }
  }

  loadDashboard();
</script>

</body>
</html>
