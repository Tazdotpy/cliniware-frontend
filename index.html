<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cliniware — Sistema de Gestión Clínica">
  <title>Cliniware — Iniciar Sesión</title>
  <link rel="stylesheet" href="css/cliniware.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">

    <div class="login-logo">
      <div class="logo-icon"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 7v10M7 12h10"/></svg></div>
      <h1>Cliniware</h1>
      <p>Sistema de Gestión Clínica</p>
    </div>

    <div id="login-error" class="login-error">
      Usuario o contraseña incorrectos. Por favor intente de nuevo.
    </div>
    

    <form class="login-form" id="login-form" novalidate>

      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Ej: admin"
          required
          autocomplete="username"
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn-login">
        Iniciar Sesión
      </button>

    </form>

    <div class="login-footer">
      <p>Cliniware &copy; 2026 — República Dominicana</p>
      <p style="margin-top:8px;font-size:0.72rem;opacity:0.7;">
        Usuarios de prueba: admin / admin123 &nbsp;|&nbsp; recepcion / rec123
      </p>
    </div>

  </div>
</div>

<script src="js/app.js"></script>
<script>
  // Redirect if already logged in
  if (Auth.isLoggedIn()) {
    window.location.href = 'dashboard.html';
  }

  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('login-error');

    const user = Auth.login(username, password);
    if (user) {
      errorEl.classList.remove('visible');
      window.location.href = 'dashboard.html';
    } else {
      errorEl.classList.add('visible');
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  });
</script>

</body>
</html>
